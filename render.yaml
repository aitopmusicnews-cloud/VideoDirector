services:
  - type: web
    runtime: static
    name: video-director
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_GEMINI_MODEL
        value: gemini-2.5-flash
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
